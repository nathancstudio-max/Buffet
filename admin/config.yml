backend:
  name: github
  repo: nathancstudio-max/Buffet
  branch: main

locale: fr
media_folder: images
public_folder: /images

collections:
  - name: buffet
    label: Mon buffet
    files:
      - name: plats
        label: Le menu (plats et boissons)
        file: content/plats.json
        fields:
          - label: Plats
            name: plats
            widget: list
            label_singular: plat
            summary: "{{fields.nom}}"
            fields:
              - { label: Nom, name: nom, widget: string }
              - label: Catégorie
                name: categorie
                widget: select
                options: ["Jus de fruits", "Salades", "Bouchées", "Prêts à croquer"]
              - { label: Étiquette (ex. Vitalité, Énergie), name: etiquette, widget: string, required: false }
              - { label: Photo, name: image, widget: image, required: false }
              - label: Pastilles (ex. 250 ml)
                name: pastilles
                widget: list
                required: false
                field: { label: Pastille, name: pastille, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Ingrédients, name: ingredients, widget: string, required: false }
              - label: Fiches légumes liées
                name: legumes
                widget: relation
                collection: buffet
                file: legumes
                search_fields: ["legumes.*.nom"]
                display_fields: ["legumes.*.nom"]
                value_field: "legumes.*.nom"
                multiple: true
                required: false

      - name: legumes
        label: Les fiches légumes
        file: content/legumes.json
        fields:
          - label: Légumes
            name: legumes
            widget: list
            label_singular: légume
            summary: "{{fields.nom}}"
            fields:
              - { label: Nom, name: nom, widget: string }
              - { label: Type (Racine, Feuille, Courge…), name: type, widget: string }
              - { label: Photo, name: image, widget: image, required: false }
              - label: Mois de saison
                name: saisons
                widget: select
                multiple: true
                options:
                  - { label: Janvier, value: 1 }
                  - { label: Février, value: 2 }
                  - { label: Mars, value: 3 }
                  - { label: Avril, value: 4 }
                  - { label: Mai, value: 5 }
                  - { label: Juin, value: 6 }
                  - { label: Juillet, value: 7 }
                  - { label: Août, value: 8 }
                  - { label: Septembre, value: 9 }
                  - { label: Octobre, value: 10 }
                  - { label: Novembre, value: 11 }
                  - { label: Décembre, value: 12 }
              - { label: Goût, name: gout, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Conservation, name: conservation, widget: string, required: false }
              - { label: Idées de préparation, name: idees, widget: string, required: false }

      - name: site
        label: Réglages du site
        file: content/site.json
        fields:
          - { label: Nom du buffet, name: nom, widget: string }
          - { label: Texte d'accueil, name: intro, widget: text }
          - label: Catégories du menu (l'ordre est celui des filtres)
            name: categories
            widget: list
            field: { label: Catégorie, name: categorie, widget: string }
