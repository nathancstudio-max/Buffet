backend:
  name: github
  repo: nathancstudio-max/Buffet
  branch: main
  base_url: https://buffet-olympique.pages.dev
  auth_endpoint: api/auth

locale: fr
media_folder: images
public_folder: /images

collections:
  - name: buffet
    label: Mon buffet
    files:
      - name: plats
        label: Le menu (plats et boissons)
        file: content/plats.json
        fields:
          - label: Plats
            name: plats
            widget: list
            label_singular: plat
            summary: "{{fields.nom}}"
            fields:
              - { label: Nom, name: nom, widget: string }
              - label: Catégorie
                name: categorie
                widget: select
                options: ["Les jus olympiques", "Velouté olympique de saison", "Préparations olympiques sucrées", "Préparations olympiques salées"]
              - { label: Étiquette (ex. Vitalité, Énergie), name: etiquette, widget: string, required: false }
              - { label: Discipline (ex. Judo), name: discipline, widget: string, required: false }
              - { label: Intitulé du plat (ex. Le plateau des champions), name: intitule, widget: string, required: false }
              - { label: Photo, name: image, widget: image, required: false }
              - label: Pastilles (ex. 250 ml)
                name: pastilles
                widget: list
                required: false
                field: { label: Pastille, name: pastille, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
              - { label: Ingrédients, name: ingredients, widget: string, required: false }
              - label: Allergènes
                name: allergenes
                widget: select
                multiple: true
                required: false
                hint: "OBLIGATOIRE : cochez tous les allergènes présents dans la recette (ex. céleri, pistache, noix). Ils s'affichent en évidence sur le site."
                options: ["Céleri", "Pistache", "Noix", "Autres fruits à coque", "Gluten", "Lait", "Œufs", "Arachides", "Soja", "Sésame", "Moutarde", "Sulfites", "Poisson", "Crustacés", "Mollusques", "Lupin", "Graines de courge"]
              - label: Fiches ingrédients liées (les fiches de l'étal)
                name: legumes
                widget: relation
                collection: buffet
                file: legumes
                search_fields: ["legumes.*.nom"]
                display_fields: ["legumes.*.nom"]
                value_field: "legumes.*.nom"
                multiple: true
                required: false
              - label: Traductions
                name: traductions
                widget: object
                collapsed: true
                required: false
                hint: "Facultatif. Si un champ reste vide, le texte français s'affiche à la place."
                fields:
                  - label: Anglais (English)
                    name: en
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Étiquette, name: etiquette, widget: string, required: false }
                      - { label: Discipline, name: discipline, widget: string, required: false }
                      - { label: Intitulé du plat, name: intitule, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Ingrédients, name: ingredients, widget: string, required: false }
                      - { label: Pastilles, name: pastilles, widget: list, required: false, field: { label: Pastille, name: pastille, widget: string } }
                  - label: Espagnol (Español)
                    name: es
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Étiquette, name: etiquette, widget: string, required: false }
                      - { label: Discipline, name: discipline, widget: string, required: false }
                      - { label: Intitulé du plat, name: intitule, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Ingrédients, name: ingredients, widget: string, required: false }
                      - { label: Pastilles, name: pastilles, widget: list, required: false, field: { label: Pastille, name: pastille, widget: string } }
                  - label: Chinois (中文)
                    name: zh
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Étiquette, name: etiquette, widget: string, required: false }
                      - { label: Discipline, name: discipline, widget: string, required: false }
                      - { label: Intitulé du plat, name: intitule, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Ingrédients, name: ingredients, widget: string, required: false }
                      - { label: Pastilles, name: pastilles, widget: list, required: false, field: { label: Pastille, name: pastille, widget: string } }
                  - label: Arabe (العربية)
                    name: ar
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Étiquette, name: etiquette, widget: string, required: false }
                      - { label: Discipline, name: discipline, widget: string, required: false }
                      - { label: Intitulé du plat, name: intitule, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Ingrédients, name: ingredients, widget: string, required: false }
                      - { label: Pastilles, name: pastilles, widget: list, required: false, field: { label: Pastille, name: pastille, widget: string } }

      - name: legumes
        label: Les fiches légumes
        file: content/legumes.json
        fields:
          - label: Légumes
            name: legumes
            widget: list
            label_singular: légume
            summary: "{{fields.nom}}"
            fields:
              - { label: Nom, name: nom, widget: string }
              - { label: Type (Racine, Feuille, Courge…), name: type, widget: string }
              - { label: Photo, name: image, widget: image, required: false }
              - label: Mois de saison
                name: saisons
                widget: select
                multiple: true
                options:
                  - { label: Janvier, value: 1 }
                  - { label: Février, value: 2 }
                  - { label: Mars, value: 3 }
                  - { label: Avril, value: 4 }
                  - { label: Mai, value: 5 }
                  - { label: Juin, value: 6 }
                  - { label: Juillet, value: 7 }
                  - { label: Août, value: 8 }
                  - { label: Septembre, value: 9 }
                  - { label: Octobre, value: 10 }
                  - { label: Novembre, value: 11 }
                  - { label: Décembre, value: 12 }
              - { label: Goût, name: gout, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
              - { label: Conservation, name: conservation, widget: string, required: false }
              - { label: "Variété (fiche détaillée : uniquement pour un produit suivi de près)", name: variete, widget: string, required: false }
              - { label: "Catégorie (I, II, Extra…)", name: categorie, widget: string, required: false }
              - { label: Calibre, name: calibre, widget: string, required: false }
              - { label: Origine, name: origine, widget: string, required: false }
              - { label: "Prix (ex. 4,90 € le kilo)", name: prix, widget: string, required: false }
              - { label: Idées de préparation (une idée par ligne), name: idees, widget: text, required: false }
              - label: Traductions
                name: traductions
                widget: object
                collapsed: true
                required: false
                hint: "Facultatif. Si un champ reste vide, le texte français s'affiche à la place."
                fields:
                  - label: Anglais (English)
                    name: en
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Nom, name: nom, widget: string, required: false }
                      - { label: Type, name: type, widget: string, required: false }
                      - { label: Goût, name: gout, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Conservation, name: conservation, widget: string, required: false }
                      - { label: Origine, name: origine, widget: string, required: false }
                      - { label: Prix, name: prix, widget: string, required: false }
                      - { label: Idées de préparation (une idée par ligne), name: idees, widget: text, required: false }
                  - label: Espagnol (Español)
                    name: es
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Nom, name: nom, widget: string, required: false }
                      - { label: Type, name: type, widget: string, required: false }
                      - { label: Goût, name: gout, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Conservation, name: conservation, widget: string, required: false }
                      - { label: Origine, name: origine, widget: string, required: false }
                      - { label: Prix, name: prix, widget: string, required: false }
                      - { label: Idées de préparation (une idée par ligne), name: idees, widget: text, required: false }
                  - label: Chinois (中文)
                    name: zh
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Nom, name: nom, widget: string, required: false }
                      - { label: Type, name: type, widget: string, required: false }
                      - { label: Goût, name: gout, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Conservation, name: conservation, widget: string, required: false }
                      - { label: Origine, name: origine, widget: string, required: false }
                      - { label: Prix, name: prix, widget: string, required: false }
                      - { label: Idées de préparation (une idée par ligne), name: idees, widget: text, required: false }
                  - label: Arabe (العربية)
                    name: ar
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Nom, name: nom, widget: string, required: false }
                      - { label: Type, name: type, widget: string, required: false }
                      - { label: Goût, name: gout, widget: string, required: false }
                      - { label: Description, name: description, widget: text, required: false }
                      - { label: Bienfaits (nutriments, intérêt pour les sportifs), name: bienfaits, widget: text, required: false }
                      - { label: Conservation, name: conservation, widget: string, required: false }
                      - { label: Origine, name: origine, widget: string, required: false }
                      - { label: Prix, name: prix, widget: string, required: false }
                      - { label: Idées de préparation (une idée par ligne), name: idees, widget: text, required: false }

      - name: site
        label: Réglages du site
        file: content/site.json
        fields:
          - { label: Nom du buffet, name: nom, widget: string }
          - { label: Texte d'accueil, name: intro, widget: text }
          - label: Catégories du menu (l'ordre est celui des sections)
            name: categories
            widget: list
            field: { label: Catégorie, name: categorie, widget: string }
          - label: Encart service traiteur (affiché en bas de chaque page)
            name: traiteur
            widget: object
            collapsed: true
            required: false
            fields:
              - { label: Afficher l'encart, name: actif, widget: boolean, default: true }
              - { label: Pastille (petit texte), name: pastille, widget: string, required: false }
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text, required: false }
              - { label: Texte du bouton, name: bouton, widget: string, required: false }
              - { label: "E-mail qui reçoit les demandes de livraison (le bouton « Envoyer par e-mail » n'apparaît que s'il est rempli)", name: email, widget: string, required: false }
              - { label: "Numéro WhatsApp avec l'indicatif du pays, sans espace ni +, ex. 33612345678 (le bouton WhatsApp n'apparaît que s'il est rempli)", name: whatsapp, widget: string, required: false }
              - { label: Photo (facultative), name: image, widget: image, required: false }
              - label: Traductions
                name: traductions
                widget: object
                collapsed: true
                required: false
                fields:
                  - label: Anglais (English)
                    name: en
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Pastille, name: pastille, widget: string, required: false }
                      - { label: Titre, name: titre, widget: string, required: false }
                      - { label: Texte, name: texte, widget: text, required: false }
                      - { label: Texte du bouton, name: bouton, widget: string, required: false }
                  - label: Espagnol (Español)
                    name: es
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Pastille, name: pastille, widget: string, required: false }
                      - { label: Titre, name: titre, widget: string, required: false }
                      - { label: Texte, name: texte, widget: text, required: false }
                      - { label: Texte du bouton, name: bouton, widget: string, required: false }
                  - label: Chinois (中文)
                    name: zh
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Pastille, name: pastille, widget: string, required: false }
                      - { label: Titre, name: titre, widget: string, required: false }
                      - { label: Texte, name: texte, widget: text, required: false }
                      - { label: Texte du bouton, name: bouton, widget: string, required: false }
                  - label: Arabe (العربية)
                    name: ar
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Pastille, name: pastille, widget: string, required: false }
                      - { label: Titre, name: titre, widget: string, required: false }
                      - { label: Texte, name: texte, widget: text, required: false }
                      - { label: Texte du bouton, name: bouton, widget: string, required: false }
          - label: Traductions
            name: traductions
            widget: object
            collapsed: true
            required: false
            hint: "Facultatif. Si un champ reste vide, le texte français s'affiche à la place."
            fields:
              - label: Anglais (English)
                name: en
                widget: object
                collapsed: true
                required: false
                fields:
                  - { label: Texte d'accueil, name: intro, widget: text, required: false }
              - label: Espagnol (Español)
                name: es
                widget: object
                collapsed: true
                required: false
                fields:
                  - { label: Texte d'accueil, name: intro, widget: text, required: false }
              - label: Chinois (中文)
                name: zh
                widget: object
                collapsed: true
                required: false
                fields:
                  - { label: Texte d'accueil, name: intro, widget: text, required: false }
              - label: Arabe (العربية)
                name: ar
                widget: object
                collapsed: true
                required: false
                fields:
                  - { label: Texte d'accueil, name: intro, widget: text, required: false }
